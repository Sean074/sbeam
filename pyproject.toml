[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sbeam"
version = "0.2.0"
description = "Simple beam finite element analysis (SOL 101 / SOL 103) with NASTRAN BDF input."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sean O'Meara", email = "sean.c.omeara74@gmail.com"},
]
keywords = ["fea", "beam", "nastran", "structural-analysis", "modal-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
]

[project.scripts]
sbeam = "sbeam.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sbeam*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E702",  # semicolons in matrix assignments — intentional paired style
    "E501",  # NASTRAN fixed-width format strings make a hard line limit impractical
    "E741",  # I, A, L, E are standard FEA/structural engineering variable names
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=sbeam --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["sbeam"]

[tool.coverage.report]
show_missing = true
skip_empty = true
