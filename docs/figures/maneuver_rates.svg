<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="g1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <style>
    .ttl{fill:#1a1a1a;font-size:14px;font-weight:bold;}
    .lbl{fill:#1a1a1a;font-size:12.5px;}
    .sub{fill:#555;font-size:11.5px;font-style:italic;}
    .ax{stroke:#333;stroke-width:1.6;}
    .ref{fill:#333;}
  </style>

  <!-- ================= Panel (a) Pitch rate q ================= -->
  <text class="ttl" x="30" y="28">(a) Pitch rate q  — side view</text>
  <line class="ax" x1="30" y1="170" x2="250" y2="170"/>
  <text class="sub" x="250" y="186" text-anchor="end">body x-axis</text>
  <!-- CG -->
  <circle class="ref" cx="90" cy="170" r="4.5"/>
  <text class="sub" x="90" y="200" text-anchor="middle">CG (x_ref)</text>
  <!-- incidence arrows growing aft -->
  <line x1="120" y1="170" x2="120" y2="156" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <line x1="160" y1="170" x2="160" y2="140" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <line x1="200" y1="170" x2="200" y2="122" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <line x1="240" y1="170" x2="240" y2="104" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <text class="lbl" x="30" y="240" fill="#c0392b">Δα = q (x − x_ref) / V∞</text>
  <text class="sub" x="30" y="258">linear aft → loads the tail → C_mq</text>

  <!-- ================= Panel (b) Roll rate p ================= -->
  <text class="ttl" x="310" y="28">(b) Roll rate p  — front view</text>
  <line class="ax" x1="310" y1="170" x2="530" y2="170"/>
  <line x1="420" y1="150" x2="420" y2="190" stroke="#9aa7b4" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="sub" x="420" y="204" text-anchor="middle">centreline</text>
  <!-- starboard up (+a), port down (-a) -->
  <line x1="455" y1="170" x2="455" y2="154" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <line x1="490" y1="170" x2="490" y2="138" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <line x1="525" y1="170" x2="525" y2="122" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <line x1="385" y1="170" x2="385" y2="186" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <line x1="350" y1="170" x2="350" y2="202" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <line x1="315" y1="170" x2="315" y2="218" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <text class="sub" x="535" y="120" text-anchor="end" fill="#c0392b">+Δα</text>
  <text class="sub" x="305" y="222" text-anchor="start" fill="#c0392b">−Δα</text>
  <text class="lbl" x="310" y="240" fill="#c0392b">Δα = p · y / V∞   (antisymmetric)</text>
  <text class="sub" x="310" y="258">down-going wing gains α → C_lp</text>

  <!-- ================= Panel (c) Yaw rate r ================= -->
  <text class="ttl" x="590" y="28">(c) Yaw rate r  — top view</text>
  <line x1="600" y1="60" x2="660" y2="60" stroke="#2e7d32" stroke-width="2" marker-end="url(#g1)"/>
  <text class="sub" x="600" y="50" fill="#2e7d32">U∞</text>
  <line class="ax" x1="590" y1="120" x2="810" y2="120"/>
  <text class="sub" x="700" y="112" text-anchor="middle">span (y)</text>
  <!-- streamwise velocity increment varying along span (advancing wing faster) -->
  <line x1="740" y1="120" x2="772" y2="120" stroke="#1f6feb" stroke-width="2.2" marker-end="url(#b1)"/>
  <line x1="770" y1="120" x2="808" y2="120" stroke="#1f6feb" stroke-width="2.2" marker-end="url(#b1)"/>
  <line x1="660" y1="120" x2="640" y2="120" stroke="#1f6feb" stroke-width="2.2" marker-end="url(#b1)"/>
  <line x1="630" y1="120" x2="600" y2="120" stroke="#1f6feb" stroke-width="2.2" marker-end="url(#b1)"/>
  <text class="sub" x="810" y="140" text-anchor="end" fill="#1f6feb">advancing</text>
  <text class="sub" x="590" y="140" text-anchor="start" fill="#1f6feb">retreating</text>
  <!-- fin sideslip -->
  <line x1="700" y1="120" x2="700" y2="225" stroke="#333" stroke-width="2.4"/>
  <line x1="700" y1="210" x2="730" y2="210" stroke="#c0392b" stroke-width="2.2" marker-end="url(#r1)"/>
  <text class="sub" x="735" y="214" text-anchor="start" fill="#c0392b">Δβ (fin)</text>
  <text class="lbl" x="590" y="258" fill="#1a1a1a">ΔU = −r·y ;  Δβ = r(x−x_ref)/V∞</text>
  <text class="sub" x="590" y="276">asym. q on wing; fin sideslip → C_nr</text>
</svg>
