name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        # requirements-ci.txt pins the exact verified toolchain — pyright output
        # depends on the numpy/scipy/pandas inline types and the pyright version,
        # so an unpinned resolve makes the type gate drift independently of the code.
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check sbeam/ sbeam_tools/ tests/

      - name: Type check (pyright)
        run: pyright

      - name: Test (pytest)
        env:
          STREAMLIT_SERVER_HEADLESS: "true"
        run: pytest -v --tb=short
